name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write       # tags and GitHub Releases
  pull-requests: write  # "chore: version packages" PR
  id-token: write       # npm provenance (signed build attestation)
  actions: write        # start the Storybook deploy after a release

jobs:
  release:
    name: Version PR or publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Check npm token
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::NPM_TOKEN secret is missing: versioning still works, publishing is skipped. See docs/RELEASING.md."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check npm account and scope
        if: steps.npm.outputs.has_token == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          SCOPE=$(node -p "require('./package.json').name.split('/')[0].slice(1)")
          if ! NPM_USER=$(npm whoami 2>/dev/null); then
            echo "::error::NPM_TOKEN is invalid or expired (npm whoami failed). Create a new granular token. See docs/RELEASING.md."
            exit 1
          fi
          echo "npm account: $NPM_USER, package scope: @$SCOPE"
          if [ "$NPM_USER" != "$SCOPE" ] && ! npm org ls "$SCOPE" >/dev/null 2>&1; then
            echo "::error::The token belongs to npm user '$NPM_USER', who does not own the @$SCOPE scope. Create the npm organization '$SCOPE' (or rename the package to @$NPM_USER/ui)."
            exit 1
          fi
      - name: Create version PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: ${{ steps.npm.outputs.has_token == 'true' && 'pnpm release' || '' }}
          title: 'chore: version packages'
          commit: 'chore: version packages'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      # changesets/action does not read the Changesets 3 publish output, so it
      # skips tags and GitHub Releases. Create them here when the version in
      # package.json is on npm but has no release yet.
      - name: Tag, GitHub Release and Storybook deploy
        id: gh_release
        if: steps.npm.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if ! npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is not on npm: nothing to release."
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released."
            exit 0
          fi
          awk -v v="$VERSION" '$0 == "## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          {
            echo
            echo "### Links"
            echo
            echo "- npm: https://www.npmjs.com/package/$NAME/v/$VERSION"
            echo "- Storybook: https://zied-snoussi.github.io/zied-ui/"
            echo "- MCP server: https://zied-ui-mcp.vercel.app/mcp"
          } >> notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md --latest
          gh workflow run storybook.yml --ref main
          echo "released=true" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: steps.gh_release.outputs.released == 'true'
        run: |
          echo "### Published to npm" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/@zied-snoussi/ui" >> "$GITHUB_STEP_SUMMARY"
